name: jungle-wagering-simples

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_HOST: postgres
  DATABASE_PORT: 5432
  DATABASE_NAME: jungle_wagering
  DATABASE_USER: jungle
  DATABASE_PASSWORD: jungle
  WALLET_LOCK_TIMEOUT_MS: 5000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jungle_wagering
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle
    command: ['postgres', '-c', 'max_connections=200', '-c', 'log_lock_waits=on']
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jungle -d jungle_wagering']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrator:
    build:
      context: .
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ['bun', 'run', 'migration:up']
    restart: 'no'

  api-1:
    build:
      context: .
    environment:
      <<: *app-env
      INSTANCE_ID: api-1
      HTTP_PORT: 3000
    ports:
      - '3001:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  api-2:
    build:
      context: .
    environment:
      <<: *app-env
      INSTANCE_ID: api-2
      HTTP_PORT: 3000
    ports:
      - '3002:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      API1_URL: http://api-1:3000
      API2_URL: http://api-2:3000
    ports:
      - '8080:8080'
    depends_on:
      - api-1
      - api-2
    restart: unless-stopped

volumes:
  postgres-data:
